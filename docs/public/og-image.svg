<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cognivo — The AI-Native Design System">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#dfff61" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#dfff61" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfff61"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle dot pattern -->
  <g fill="#ffffff" fill-opacity="0.03">
    <circle cx="60"  cy="60"  r="1.5"/>
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="1040" cy="90" r="1.5"/>
    <circle cx="1140" cy="540" r="1.5"/>
    <circle cx="100" cy="520" r="1.5"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(96, 96)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#dfff61" stroke-width="3"/>
    <text x="60" y="34"
          font-family="Inter, system-ui, sans-serif"
          font-weight="600"
          font-size="28"
          fill="#fafafa"
          letter-spacing="-0.01em">cognivo</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(1020, 108)">
    <rect x="-60" y="-22" width="120" height="36" rx="18"
          fill="none" stroke="#dfff61" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="3"
          font-family="'Geist Mono', ui-monospace, monospace"
          font-size="14"
          font-weight="600"
          fill="#dfff61"
          text-anchor="middle">v0.4</text>
  </g>

  <!-- Wordmark title -->
  <text x="96" y="340"
        font-family="Inter, system-ui, sans-serif"
        font-weight="800"
        font-size="128"
        fill="url(#wordGrad)"
        letter-spacing="-0.04em">Cognivo</text>

  <!-- Subtitle -->
  <text x="96" y="410"
        font-family="Inter, system-ui, sans-serif"
        font-weight="600"
        font-size="36"
        fill="#fafafa"
        letter-spacing="-0.02em">AI-Native Design System</text>

  <!-- Meta line -->
  <text x="96" y="460"
        font-family="Inter, system-ui, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#a1a1aa"
        letter-spacing="-0.01em">Web Components · Generative UI · Cognitive Biases</text>

  <!-- Bottom meta chips -->
  <g transform="translate(96, 530)" font-family="'Geist Mono', ui-monospace, monospace" font-size="14" font-weight="500">
    <g>
      <rect x="0" y="0" width="140" height="36" rx="18"
            fill="none" stroke="#1e1e22" stroke-width="1"/>
      <text x="70" y="23" fill="#a1a1aa" text-anchor="middle">182 components</text>
    </g>
    <g transform="translate(152, 0)">
      <rect x="0" y="0" width="110" height="36" rx="18"
            fill="none" stroke="#1e1e22" stroke-width="1"/>
      <text x="55" y="23" fill="#a1a1aa" text-anchor="middle">1,906 tests</text>
    </g>
    <g transform="translate(274, 0)">
      <rect x="0" y="0" width="72" height="36" rx="18"
            fill="none" stroke="#1e1e22" stroke-width="1"/>
      <text x="36" y="23" fill="#a1a1aa" text-anchor="middle">MIT</text>
    </g>
  </g>
</svg>
