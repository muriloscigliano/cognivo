<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognivo — Component Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    [data-theme="dark"] {
      --bg: #09090B;
      --bg-sidebar: #0F0F11;
      --bg-card: #18181B;
      --bg-raised: #27272A;
      --border: #27272A;
      --border-subtle: #1E1E21;
      --text: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --text-dim: #52525B;
      --accent: #DFFF61;
      --accent-bg: rgba(223, 255, 97, 0.06);
      --accent-border: rgba(223, 255, 97, 0.15);
    }
    [data-theme="light"] {
      --bg: #FAFAFA;
      --bg-sidebar: #F4F4F5;
      --bg-card: #FFFFFF;
      --bg-raised: #F4F4F5;
      --border: #E4E4E7;
      --border-subtle: #F4F4F5;
      --text: #09090B;
      --text-secondary: #52525B;
      --text-muted: #71717A;
      --text-dim: #A1A1AA;
      --accent: #86993A;
      --accent-bg: rgba(134, 153, 58, 0.06);
      --accent-border: rgba(134, 153, 58, 0.15);
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 52px 1fr;
      height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }
    .logo {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 8px;
    }
    .topbar-search {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    .topbar-search input {
      width: 100%;
      padding: 6px 12px 6px 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-sidebar);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 150ms;
    }
    .topbar-search input:focus { border-color: var(--accent); }
    .topbar-search input::placeholder { color: var(--text-dim); }
    .topbar-search .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 12px;
    }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .theme-btn, .count-badge {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-secondary);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 150ms;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .count-badge { cursor: default; color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 0;
    }
    .sidebar-category {
      padding: 0 16px;
      margin-bottom: 4px;
    }
    .category-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 12px 0 6px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 100ms;
      text-decoration: none;
    }
    .sidebar-item:hover { background: var(--accent-bg); color: var(--text); }
    .sidebar-item.active {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .sidebar-item .tag-prefix {
      font-size: 10px;
      color: var(--text-dim);
      font-family: monospace;
    }

    /* ── Main content ── */
    .main {
      overflow-y: auto;
      padding: 32px 40px;
      background: var(--bg);
    }

    /* ── Component page ── */
    .page-header {
      margin-bottom: 28px;
    }
    .page-tag {
      font-family: monospace;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .page-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-top: 8px;
      max-width: 640px;
    }
    .page-badges {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .page-badge {
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 5px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    /* ── Example section ── */
    .examples {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 32px;
    }
    .example-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .example-label {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .example-preview {
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .example-code {
      padding: 14px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-subtle);
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 150ms;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent-border); }

    /* ── Props table ── */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      margin-top: 8px;
    }
    .props-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 32px;
    }
    .props-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    .props-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .props-table td:first-child {
      font-family: monospace;
      font-weight: 600;
      color: var(--accent);
    }
    .props-table td:nth-child(2) {
      font-family: monospace;
      color: var(--text-muted);
    }

    /* ── Welcome page ── */
    .welcome {
      max-width: 640px;
    }
    .welcome h1 {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .welcome .accent { color: var(--accent); }
    .welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .stat-row {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
    }
    .stat {
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 120px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar-item, .theme-btn, .copy-btn { transition: none; }
    }

    /* ── Interactive Playground ── */
    .playground { margin-bottom: 32px; }
    .playground-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      margin-bottom: 12px;
    }
    .playground-preview {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .playground-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }
    .preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 50%, rgba(223, 255, 97, 0.02), transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 19px, var(--border-subtle) 19px, var(--border-subtle) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, var(--border-subtle) 19px, var(--border-subtle) 20px);
    }
    .playground-controls {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      max-height: 400px;
      overflow-y: auto;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }
    .control-row:last-child { border-bottom: none; }
    .control-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      min-width: 70px;
    }
    .control-select, .control-input {
      flex: 1;
      max-width: 140px;
      padding: 4px 8px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms;
    }
    .control-select:focus, .control-input:focus {
      border-color: var(--accent);
    }
    .control-toggle { display: flex; align-items: center; }
    .control-color {
      width: 32px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .playground-code {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .code-output {
      padding: 12px 16px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--accent);
      overflow-x: auto;
      white-space: pre;
      margin: 0;
    }
    .copy-btn-sm {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 150ms;
    }
    .copy-btn-sm:hover { color: var(--text); border-color: var(--accent); }

    /* ── Welcome Feature Cards ── */
    .welcome-features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
    }
    .feature-card {
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 200ms, box-shadow 200ms;
    }
    .feature-card:hover {
      border-color: rgba(223, 255, 97, 0.2);
      box-shadow: 0 0 20px -8px rgba(223, 255, 97, 0.15);
    }
    .feature-icon { font-size: 20px; margin-bottom: 8px; }
    .feature-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .feature-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    @media (max-width: 768px) {
      .playground-grid { grid-template-columns: 1fr; }
      .welcome-features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span class="logo">Cognivo</span>
      <span class="logo-sub">Component Library</span>
      <div class="topbar-search">
        <span class="search-icon">🔍</span>
        <input id="search" type="text" placeholder="Search components... ⌘K" />
      </div>
      <div class="topbar-right">
        <span class="count-badge" id="count-badge">54 components</span>
        <button class="theme-btn" id="theme-toggle">Dark</button>
      </div>
    </div>

    <nav class="sidebar" id="sidebar" aria-label="Components"></nav>

    <main class="main" id="main" role="main"></main>
  </div>

  <script type="module" src="/src/showcase.ts"></script>
</body>
</html>
