<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognivo — Component Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    [data-theme="dark"] {
      --bg: #09090b;
      --bg-nav: rgba(9,9,11,0.82);
      --bg-sidebar: #0c0c0f;
      --bg-card: #111113;
      --bg-card-hover: #18181b;
      --bg-code: #0c0c0f;
      --bg-preview: #09090b;
      --border: #1e1e22;
      --border-subtle: rgba(255,255,255,0.04);
      --border-hover: #2e2e33;
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --text-4: #3f3f46;
      --accent: #dfff61;
      --accent-dim: #b8d94e;
      --accent-2: rgba(223,255,97,0.07);
      --accent-3: rgba(223,255,97,0.13);
      --blue: #3b82f6;
      --mono: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --dot-color: rgba(255,255,255,0.04);
      --scrollbar-thumb: #27272a;
      --scrollbar-hover: #3f3f46;
      --selection-bg: rgba(223,255,97,0.18);
      --selection-text: #fff;
      --row-hover: rgba(255,255,255,0.02);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.5);
      --glow-accent: 0 0 40px rgba(223,255,97,0.06);
    }
    [data-theme="light"] {
      --bg: #fafafa;
      --bg-nav: rgba(250,250,250,0.82);
      --bg-sidebar: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9fb;
      --bg-code: #f4f4f5;
      --bg-preview: #fafafa;
      --border: #e4e4e7;
      --border-subtle: rgba(0,0,0,0.04);
      --border-hover: #a1a1aa;
      --text: #09090b;
      --text-2: #52525b;
      --text-3: #71717a;
      --text-4: #a1a1aa;
      --accent: #4d7c0f;
      --accent-dim: #3f6212;
      --accent-2: rgba(77,124,15,0.06);
      --accent-3: rgba(77,124,15,0.12);
      --blue: #2563eb;
      --mono: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --dot-color: rgba(0,0,0,0.04);
      --scrollbar-thumb: #d4d4d8;
      --scrollbar-hover: #a1a1aa;
      --selection-bg: rgba(77,124,15,0.15);
      --selection-text: #09090b;
      --row-hover: rgba(0,0,0,0.02);
      --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.08);
      --glow-accent: 0 0 40px rgba(77,124,15,0.04);
    }

    ::selection { background: var(--selection-bg); color: var(--selection-text); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    /* ═══ LAYOUT ═══ */
    .app {
      display: grid;
      grid-template-columns: 248px 1fr;
      grid-template-rows: 52px 1fr;
      height: 100vh;
    }

    /* ═══ NAV ═══ */
    .nav {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--bg-nav);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      gap: 0;
    }
    .nav-logo {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      padding: 0 12px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .nav-logo svg { color: var(--accent); }
    .nav-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 12px;
      flex-shrink: 0;
    }
    .nav-context {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
    }
    .nav-search {
      margin-left: auto;
      position: relative;
    }
    .nav-search input {
      width: 220px;
      padding: 7px 12px 7px 30px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: 12px var(--mono);
      outline: none;
      transition: width 250ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }
    .nav-search input:focus {
      width: 320px;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-2);
    }
    .nav-search input::placeholder { color: var(--text-4); }
    .nav-search svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-4);
      pointer-events: none;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 12px;
    }
    .nav-badge {
      font: 600 11px/1 var(--mono);
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-2);
      color: var(--accent);
      border: 1px solid var(--accent-3);
    }
    .nav-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      background: none;
      color: var(--text-3);
      cursor: pointer;
      border-radius: 8px;
      transition: color 150ms, background 150ms, border-color 150ms;
    }
    .nav-btn:hover {
      color: var(--text);
      background: var(--accent-2);
      border-color: var(--accent-3);
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 8px 32px;
    }
    .cat-title {
      font: 600 10px/1 'Inter', sans-serif;
      color: var(--text-4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 24px 10px 8px;
    }
    .cat-title:first-child { padding-top: 8px; }
    .sb-item {
      display: block;
      padding: 7px 10px 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-3);
      cursor: pointer;
      transition: color 100ms, background 100ms, border-color 100ms;
      text-decoration: none;
      border-left: 2px solid transparent;
      line-height: 1.3;
    }
    .sb-item:hover {
      color: var(--text-2);
      background: var(--row-hover);
    }
    .sb-item.active {
      color: var(--text);
      background: var(--accent-2);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    .sb-tag {
      font: 10px var(--mono);
      color: var(--text-4);
      margin-right: 4px;
    }

    /* ═══ MAIN ═══ */
    .main {
      overflow-y: auto;
      padding: 48px 64px 80px;
    }

    /* ═══ PAGE HEADER ═══ */
    .pg-hd { margin-bottom: 48px; }
    .pg-tag {
      font: 500 13px/1 var(--mono);
      color: var(--accent);
      margin-bottom: 10px;
    }
    .pg-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--text);
    }
    .pg-desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-2);
      margin-top: 12px;
      max-width: 560px;
    }
    .pg-badges {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .pg-badge {
      font: 600 10px/1 var(--mono);
      padding: 5px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--accent-2);
      color: var(--accent);
      border: 1px solid var(--accent-3);
    }

    /* ═══ SECTION TITLES ═══ */
    .sec-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* ═══ PLAYGROUND ═══ */
    .playground { margin-bottom: 48px; }
    .playground-grid {
      display: grid;
      grid-template-columns: 1fr 264px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .playground-preview {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
    }
    .playground-controls {
      background: var(--bg-card);
      overflow-y: auto;
      max-height: 440px;
    }
    .pg-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      font: 600 10px/1 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-4);
      border-bottom: 1px solid var(--border);
    }
    .preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      padding: 40px;
      position: relative;
      overflow: visible;
      background-color: var(--bg-preview);
      background-image:
        radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }
    .ctrl-row:last-child { border-bottom: none; }
    .ctrl-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
      min-width: 64px;
    }
    .ctrl-select, .ctrl-input {
      flex: 1;
      max-width: 140px;
      padding: 5px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: 12px var(--mono);
      outline: none;
      transition: border-color 150ms;
    }
    .ctrl-select:focus, .ctrl-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-2);
    }
    .ctrl-toggle { display: flex; align-items: center; }
    .ctrl-color {
      width: 28px;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .pg-code {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-top: 8px;
      box-shadow: var(--shadow-card);
    }
    .code-out {
      padding: 14px 16px;
      font: 12px/1.6 var(--mono);
      color: var(--accent);
      overflow-x: auto;
      white-space: pre;
      margin: 0;
    }
    .cp-sm {
      font: 500 10px 'Inter', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-4);
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: color 150ms, border-color 150ms;
    }
    .cp-sm:hover { color: var(--text-2); border-color: var(--border-hover); }

    /* ═══ EXAMPLES ═══ */
    .examples {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 48px;
    }
    .ex-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: box-shadow 200ms ease;
    }
    .ex-card:hover { box-shadow: var(--shadow-card-hover); }
    .ex-label {
      padding: 11px 16px;
      font: 600 12px/1 'Inter', sans-serif;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .ex-preview {
      padding: 32px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: var(--bg-preview);
      background-image:
        radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .ex-code {
      padding: 14px 16px;
      background: var(--bg-code);
      border-top: 1px solid var(--border);
      font: 12px/1.7 var(--mono);
      color: var(--text-3);
      overflow-x: auto;
      white-space: pre;
      position: relative;
    }
    .cp-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      font: 500 10px 'Inter', sans-serif;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-4);
      cursor: pointer;
      transition: color 100ms, border-color 100ms;
    }
    .cp-btn:hover { color: var(--text-2); border-color: var(--border-hover); }

    /* ═══ TABLES ═══ */
    .api-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .api-table th {
      text-align: left;
      padding: 11px 16px;
      font: 600 10px/1 'Inter', sans-serif;
      color: var(--text-4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .api-table td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-2);
      vertical-align: top;
    }
    .api-table tr:last-child td { border-bottom: none; }
    .api-table tr:hover td { background: var(--row-hover); }
    .api-table td:first-child {
      font: 500 12px var(--mono);
      color: var(--accent);
    }
    .api-table td:nth-child(2) {
      font: 400 12px var(--mono);
      color: var(--text-3);
    }

    /* ═══ WELCOME ═══ */
    .welcome { max-width: 680px; }
    .welcome h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 20px;
    }
    .welcome h1 .hi {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome > p {
      font-size: 16px;
      color: var(--text-2);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 40px;
      box-shadow: var(--shadow-card);
    }
    .stat-cell {
      background: var(--bg-card);
      padding: 24px 20px;
      text-align: center;
      transition: background 200ms;
    }
    .stat-cell:hover { background: var(--bg-card-hover); }
    .stat-val {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat-lbl {
      font: 600 10px/1 var(--mono);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 10px;
    }
    .feat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 40px;
      box-shadow: var(--shadow-card);
    }
    .feat-cell {
      background: var(--bg-card);
      padding: 28px 24px;
      transition: background 200ms;
    }
    .feat-cell:hover { background: var(--bg-card-hover); }
    .feat-cell h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .feat-cell p {
      font-size: 13px;
      color: var(--text-3);
      line-height: 1.6;
    }
    .qs {
      margin-bottom: 36px;
    }
    .qs-title {
      font: 600 10px/1 'Inter', sans-serif;
      color: var(--text-4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .qs-block {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      font: 13px/1.7 var(--mono);
      color: var(--text-2);
      overflow-x: auto;
      box-shadow: var(--shadow-card);
    }
    .qs-block .kw { color: var(--accent); }
    .qs-block .str { color: var(--accent-dim); }
    .qs-block .cmt { color: var(--text-4); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .playground-grid { grid-template-columns: 1fr; }
      .playground-preview { border-right: none; border-bottom: 1px solid var(--border); }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .feat-grid { grid-template-columns: 1fr; }
      .main { padding: 24px 20px 48px; }
      .welcome h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div class="nav-logo">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7"/></svg>
        Cognivo
      </div>
      <div class="nav-sep"></div>
      <span class="nav-context">Components</span>
      <div class="nav-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="17" y1="17" x2="21" y2="21"/></svg>
        <input id="search" type="text" placeholder="Search components..." />
      </div>
      <div class="nav-right">
        <span class="nav-badge" id="count-badge">140</span>
        <button class="nav-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Components"></nav>
    <main class="main" id="main" role="main"></main>
  </div>

  <script type="module" src="/src/showcase.ts"></script>
</body>
</html>
